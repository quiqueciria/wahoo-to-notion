name: Sync Wahoo with Notion

on:
  schedule:
    - cron: "0 2 * * *" # Ejecutar todos los días a las 2:00 AM UTC
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

permissions:
  contents: write # 👈 CRUCIAL: Otorga permisos al workflow para modificar y hacer commit en el repositorio

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run Wahoo to Notion Sync Script
        env:
          WAHOO_REFRESH_TOKEN: ${{ secrets.WAHOO_REFRESH_TOKEN }}
          WAHOO_CLIENT_ID: ${{ secrets.WAHOO_CLIENT_ID }}
          WAHOO_CLIENT_SECRET: ${{ secrets.WAHOO_CLIENT_SECRET }}
          NOTION_INTEGRATION_TOKEN: ${{ secrets.NOTION_INTEGRATION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          node sync-wahoo.js

      - name: Commit updated refresh token automatically
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Wahoo refresh token [skip ci]"
          file_pattern: "tokens.json"
